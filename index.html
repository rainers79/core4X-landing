<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core4X – Modulare Vereinsplattform</title>
    <meta name="description" content="Core4X ist eine moderne, modulare Vereinsplattform für Organisation, Kommunikation, Projekte und Boniersystem. Core4X jetzt verfügbar: Basic kostenlos, Pro zum Einführungspreis von 126 € pro Jahr." />
    <link rel="icon" type="image/png" href="/core4x-icon-512.png" />
    <link rel="apple-touch-icon" href="/core4x-icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const addAccountDeletionLink = () => {
        const footer = document.querySelector('footer')
        if (!footer || footer.querySelector('a[href="/account-deletion.html"]')) return false
        const impressum = Array.from(footer.querySelectorAll('button')).find((el) => el.textContent?.trim() === 'Impressum')
        if (!impressum || !impressum.parentElement) return false
        const link = document.createElement('a')
        link.href = '/account-deletion.html'
        link.textContent = 'Konto löschen'
        link.className = 'text-xs font-semibold text-black/40 hover:text-black'
        impressum.insertAdjacentElement('afterend', link)
        return true
      }
      const observer = new MutationObserver(() => {
        if (addAccountDeletionLink()) observer.disconnect()
      })
      observer.observe(document.documentElement, { childList: true, subtree: true })
      addAccountDeletionLink()
    </script>
  </body>
</html>
