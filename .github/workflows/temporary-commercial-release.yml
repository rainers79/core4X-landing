name: Temporary commercial landing update

on:
  push:
    paths:
      - '.github/workflows/temporary-commercial-release.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update commercial messaging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          replacements = {
            '>Alpha</button>': '>Verfügbar</button>',
            'Alpha vormerken': 'Interesse anmelden',
            'Alpha in Vorbereitung': 'Core4X jetzt verfügbar',
            'Alpha-Phase': 'Jetzt verfügbar',
            'Jetzt vormerken.': 'Core4X jetzt nutzen.',
            'Core4X wird praxisnah weiterentwickelt. Interessierte Vereine können sich für die Alpha vormerken lassen.': 'Core4X ist verfügbar. Vereine können unverbindlich Interesse anmelden und den passenden Einstieg mit Basic oder Pro wählen.',
            'Du bist dabei!': 'Danke für dein Interesse!',
            'Wir melden uns, sobald der nächste Testschritt startet.': 'Wir melden uns mit den nächsten Schritten für deinen Core4X-Einstieg.',
            'Für Alpha vormerken': 'Interesse anmelden',
            'Keine Zahlung erforderlich. Nur eine Vormerkung.': 'Die Interessensmeldung ist unverbindlich und kostenlos.',
            'Pro-Version vormerken': 'Pro-Interesse anmelden',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          if 'Alpha' in s:
              raise SystemExit('Remaining Alpha wording found in src/App.tsx')
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text().replace('Jetzt für die Alpha vormerken.', 'Core4X jetzt verfügbar: Basic kostenlos, Pro zum Einführungspreis von 126 € pro Jahr.')
          if 'Alpha' in s:
              raise SystemExit('Remaining Alpha wording found in index.html')
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/temporary-commercial-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx index.html .github/workflows/temporary-commercial-release.yml
          git commit -m "feat: publish commercial landing page messaging"
          git push
